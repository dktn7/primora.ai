<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Primora Card 3 – Smooth SVG Animation</title>
  <style>
    /* ─── Page Layout ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4f0eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    h1 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      padding: 2rem;
      max-width: 560px;
      width: 95vw;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    #status {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
      min-height: 1.4em;
    }

    /* ─── SVG Colours ─── */

    /* All drawable paths — black stroke, matching original style */
    #mainSVG path {
      fill: none;
      stroke: #000;
      stroke-miterlimit: 100;
    }

    /* Brain nodes — yellow circles */
    #brain .node {
      fill: #FFD700;
      stroke: #D97706;
      stroke-width: 1.5;
      fill-opacity: 0;
    }

    /* Tie — yellow */
    #tie {
      fill: #FFD700;
      stroke: #D97706;
      stroke-width: 1.5;
      stroke-linejoin: round;
      fill-opacity: 0;
    }

    /* Tick / checkmark — yellow */
    #tick {
      fill: none;
      stroke: #FFD700;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Stars — yellow */
    .star {
      fill: #FFD700;
      stroke: #D97706;
      stroke-width: 1;
      stroke-linejoin: round;
      fill-opacity: 0;
    }

    /* Step arrows between scenes */
    .step-arrow {
      fill: none;
      stroke: #000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .arrow-head {
      fill: #000;
      stroke: none;
    }
  </style>
</head>

    <div id="status">Smooth SVG animation is playing.</div>
  </div>

  <script>
    const FALLBACK_LENGTH = 100;
    const STROKE_DURATION = 900;
    const STROKE_STAGGER = 130;
    const FILL_DURATION = 320;
    const FILL_STAGGER = 80;
    const ARROW_DURATION = 420;
    const ARROW_GAP = 120;
    const SCENE_GAP = 140;
    const LOOP_DELAY = 700;

    const sceneConfig = [
      { id: 'leftPerson', label: 'Scene 1 · Stressed', fillSel: null },
      { id: 'brain', label: 'Scene 2 · Primora AI', fillSel: '#brain .node' },
      { id: 'rightPerson', label: 'Scene 3 · Empowered', fillSel: '#rightPerson #tie, #rightPerson .star' },
    ];

    const arrowConfig = [
      { lineId: 'arrowLine1', headId: 'arrowHead1' },
      { lineId: 'arrowLine2', headId: 'arrowHead2' },
    ];

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const statusEl = document.getElementById('status');

    function wait(ms, signal) {
      if (signal?.aborted) {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        const timeoutId = setTimeout(() => {
          signal?.removeEventListener('abort', handleAbort);
          resolve();
        }, ms);

        function handleAbort() {
          clearTimeout(timeoutId);
          signal?.removeEventListener('abort', handleAbort);
          resolve();
        }

        signal?.addEventListener('abort', handleAbort, { once: true });
      });
    }

    function getDrawLength(el) {
      if (typeof el.getTotalLength === 'function') {
        try { return el.getTotalLength(); } catch (e) { /* intentional fall-through */ }
      }

      const tag = el.tagName.toLowerCase();
      if (tag === 'circle') {
        return 2 * Math.PI * parseFloat(el.getAttribute('r') || 5);
      }

      if (tag === 'polyline' || tag === 'polygon') {
        const pts = el.points;
        let len = 0;
        for (let i = 1; i < pts.numberOfItems; i++) {
          const a = pts.getItem(i - 1);
          const b = pts.getItem(i);
          len += Math.hypot(b.x - a.x, b.y - a.y);
        }
        if (tag === 'polygon' && pts.numberOfItems > 1) {
          const a = pts.getItem(pts.numberOfItems - 1);
          const b = pts.getItem(0);
          len += Math.hypot(b.x - a.x, b.y - a.y);
        }
        return len || FALLBACK_LENGTH;
      }

      return FALLBACK_LENGTH;
    }

    function sortByX(elements) {
      return elements.slice().sort((a, b) => {
        const boxA = a.getBBox();
        const boxB = b.getBBox();
        return (boxA.x + boxA.width / 2) - (boxB.x + boxB.width / 2);
      });
    }

    function getGroupEls(groupId) {
      const nodes = document.querySelectorAll(
        `#${groupId} path, #${groupId} circle, #${groupId} polyline, #${groupId} polygon`
      );
      return sortByX(Array.from(nodes));
    }

    function setStrokeState(el, hidden) {
      const length = getDrawLength(el);
      el.style.strokeDasharray = `${length}`;
      el.style.strokeDashoffset = hidden ? `${length}` : '0';
    }

    function cancelAnimations(el) {
      el.getAnimations().forEach(animation => animation.cancel());
    }

    function prepareElements() {
      sceneConfig.forEach(scene => {
        getGroupEls(scene.id).forEach(el => setStrokeState(el, true));
      });

      document.querySelectorAll('#brain .node, #rightPerson #tie, #rightPerson .star')
        .forEach(el => {
          el.style.fillOpacity = '0';
        });

      arrowConfig.forEach(arrow => {
        const line = document.getElementById(arrow.lineId);
        const head = document.getElementById(arrow.headId);

        if (line) {
          setStrokeState(line, true);
        }
        if (head) {
          head.style.opacity = '0';
        }
      });
    }

    function revealAll() {
      sceneConfig.forEach(scene => {
        getGroupEls(scene.id).forEach(el => setStrokeState(el, false));
      });

      document.querySelectorAll('#brain .node, #rightPerson #tie, #rightPerson .star')
        .forEach(el => {
          el.style.fillOpacity = '1';
        });

      arrowConfig.forEach(arrow => {
        const line = document.getElementById(arrow.lineId);
        const head = document.getElementById(arrow.headId);

        if (line) {
          setStrokeState(line, false);
        }
        if (head) {
          head.style.opacity = '1';
        }
      });
    }

    function animateStroke(el, delay = 0, duration = STROKE_DURATION) {
      const length = getDrawLength(el);
      cancelAnimations(el);
      el.style.strokeDasharray = `${length}`;
      el.style.strokeDashoffset = `${length}`;
      return el.animate(
        [
          { strokeDashoffset: `${length}` },
          { strokeDashoffset: '0' }
        ],
        {
          duration,
          delay,
          easing: 'cubic-bezier(0.33, 0, 0.2, 1)',
          fill: 'forwards'
        }
      ).finished;
    }

    function animateFill(el, delay = 0) {
      cancelAnimations(el);
      el.style.fillOpacity = '0';
      return el.animate(
        [
          { fillOpacity: 0 },
          { fillOpacity: 1 }
        ],
        {
          duration: FILL_DURATION,
          delay,
          easing: 'ease-out',
          fill: 'forwards'
        }
      ).finished;
    }

    function animateOpacity(el, delay = 0) {
      cancelAnimations(el);
      el.style.opacity = '0';
      return el.animate(
        [
          { opacity: 0 },
          { opacity: 1 }
        ],
        {
          duration: 220,
          delay,
          easing: 'ease-out',
          fill: 'forwards'
        }
      ).finished;
    }

    async function animateScene(scene) {
      statusEl.textContent = scene.label;

      const drawableEls = getGroupEls(scene.id);
      await Promise.all(
        drawableEls.map((el, index) => animateStroke(el, index * STROKE_STAGGER))
      );

      if (scene.fillSel) {
        const fillEls = Array.from(document.querySelectorAll(scene.fillSel));
        await Promise.all(
          fillEls.map((el, index) => animateFill(el, index * FILL_STAGGER))
        );
      }
    }

    async function animateArrow(arrow) {
      const line = document.getElementById(arrow.lineId);
      const head = document.getElementById(arrow.headId);

      if (line) {
        await animateStroke(line, 0, ARROW_DURATION);
      }
      if (head) {
        await animateOpacity(head, 0);
      }
    }

    async function runAnimationLoop(signal) {
      while (!signal.aborted) {
        prepareElements();

        for (let index = 0; index < sceneConfig.length; index += 1) {
          if (signal.aborted) {
            return;
          }

          await animateScene(sceneConfig[index]);

          if (index < arrowConfig.length) {
            await wait(ARROW_GAP, signal);
            if (signal.aborted) {
              return;
            }
            await animateArrow(arrowConfig[index]);
          }

          await wait(SCENE_GAP, signal);
        }

        statusEl.textContent = 'Looping smooth animation…';
        await wait(LOOP_DELAY, signal);
      }
    }

    if (prefersReducedMotion) {
      revealAll();
      statusEl.textContent = 'Animation paused because reduced motion is enabled.';
    } else {
      const animationController = new AbortController();
      const stopAnimationLoop = () => animationController.abort();

      window.addEventListener('pagehide', stopAnimationLoop, { once: true });
      window.addEventListener('beforeunload', stopAnimationLoop, { once: true });

      runAnimationLoop(animationController.signal);
    }
  </script>
